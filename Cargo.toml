[package]
name = "elephantry-lint"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0"
elephantry = "5.3"
regex = "1.13"

[dev-dependencies]
dylint_testing = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true

[[example]]
name = "invalid_query"
path = "ui/invalid_query.rs"

[[example]]
name = "mix_param_type"
path = "ui/mix_param_type.rs"

[[example]]
name = "pager_start_page"
path = "ui/pager_start_page.rs"

[[example]]
name = "param_arg_count"
path = "ui/param_arg_count.rs"
